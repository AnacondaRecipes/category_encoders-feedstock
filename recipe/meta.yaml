{% set name = "category_encoders" %}
{% set version = "2.11.2" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Upstream tagged the 2.11.2 release commit as "v2.12.2" and never created a
  # v2.11.2 tag, so the tag name does not match the version it contains
  # (pyproject.toml and category_encoders.__version__ both report 2.11.2).
  url: https://github.com/scikit-learn-contrib/{{ name }}/archive/refs/tags/v2.12.2.tar.gz
  sha256: e9d9e7e2dcfdd93e1ada7680c5d3333d1da6d16901a34b678b05c6789fa03d38

build:
  number: 0
  skip: true  # [py<311]
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv

requirements:
  host:
    - pip
    - python
    - poetry-core
  run:
    - python
    - numpy >=1.14.0
    - pandas >=1.0.5
    - scikit-learn >=1.6.0
    - scipy >=1.0.0
  run_constrained:
    - statsmodels >=0.9.0

test:
  source_files:
    - tests
  imports:
    - category_encoders
  commands:
    - pip check
    - pytest -vv tests
  requires:
    - pip
    - pytest
    - pytest-subtests
    # statsmodels 0.15 changes GLMMEncoder numerics and breaks the dtype-parity
    # subtests (test_missing_values/test_metamorphic/test_column_transformer);
    # upstream poetry.lock pins the same cap.
    - statsmodels >=0.9.0,<0.15
    # golden tests expect object dtype; remove when upstream supports pandas 3
    - pandas <3

about:
  home: https://github.com/scikit-learn-contrib/category_encoders
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.md
  summary: A collection sklearn transformers to encode categorical variables as numeric
  doc_url: https://contrib.scikit-learn.org/category_encoders
  dev_url: https://github.com/scikit-learn-contrib/category_encoders
  description: |
    A set of scikit-learn-style transformers for encoding categorical variables
    into numeric with different techniques. While ordinal, one-hot, and hashing
    encoders have similar equivalents in the existing scikit-learn version, the
    transformers in this library all share a few useful properties:
    - First-class support for pandas dataframes as an input (and optionally as
    output)
    - Can explicitly configure which columns in the data are encoded by name or
    index, or infer non-numeric columns regardless of input type
    - Can drop any columns with very low variance based on training set
    optionally
    - Portability: train a transformer on data, pickle it, reuse it later and
    get the same thing out.
    - Full compatibility with sklearn pipelines, input an array-like dataset
    like any other transformer

extra:
  recipe-maintainers:
    - bollwyvl
    - nirajd
    - wdm0006
